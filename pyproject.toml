[project]
name = "vcip"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hasan-raza-01", email = "hasan.raza12003@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastparquet>=2026.5.0",
    "ipykernel==7.3.0",
    "openpyxl==3.1.5",
    "pandas==3.0.5",
    "psycopg[binary,pool]>=3.3.6",
    "pyarrow>=25.0.1",
    "pydantic==2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml==6.0.3",
    "sqlalchemy>=2.0.54",
    "torch>=2.14.0",
]

[project.scripts]
vantara-customer-intelligence-platform = "vantara_customer_intelligence_platform:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "vcip",
]
